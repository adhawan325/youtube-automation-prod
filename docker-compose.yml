version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/app/media:ro
      - ./logs:/var/log/nginx
    depends_on:
      - youtube-automation
    restart: unless-stopped

  youtube-automation:
    build: .
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - NEWSAPI_AI_KEY=${NEWSAPI_AI_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/automation/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

